name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @globeguide/api prisma:generate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Verify static beta pages
        run: |
          test -f apps/web/out/index.html
          test -f apps/web/out/search/index.html
          test -f apps/web/out/saved/index.html
          test -f apps/web/out/trips/index.html
          test -f apps/web/out/destinations/22222222-2222-4222-8222-222222222222/index.html
      - name: Install browser for beta smoke
        run: pnpm --filter @globeguide/web exec playwright install --with-deps chromium
      - name: Test beta in desktop and mobile browsers
        run: pnpm --filter @globeguide/web test:e2e
